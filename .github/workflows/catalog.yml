# The reference's two duties, so the reviewer only has to listen
# (forkstify, docs/conception/sortie.md — "La relecture côté référence"):
#
#   check  on every pull request: only cards/ may change, and every card
#          reads, carries format = 1, a name, an mbid unique across the
#          catalog, a slug for a file name, links whose targets are slugs
#          and whose types are the closed list. `forkstify validate`.
#   index  on every push to main that touched the cards: the vectors are
#          regenerated by `forkstify vectors` and committed. The index is
#          derived (0019) and never enters a pull request.
#
# Both build forkstify from its repository. While aropixel/forkstify is
# private, the checkout needs a token that can read it: the secret
# FORKSTIFY_TOKEN (a fine-grained PAT, Contents: read on that repository).
# Once public, the workflow's own token is enough.
name: catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ["cards/**", "catalog.toml"]

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: only cards may change
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          echo "$changed"
          outside="$(echo "$changed" | grep -v '^cards/' || true)"
          if [ -n "$outside" ]; then
            echo "::error::a proposal carries cards only — not: $outside"
            exit 1
          fi
      - uses: ./.github/actions/forkstify
        with:
          token: ${{ secrets.FORKSTIFY_TOKEN || github.token }}
      - name: forkstify validate
        run: app/target/release/forkstify validate .

  index:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/forkstify
        with:
          token: ${{ secrets.FORKSTIFY_TOKEN || github.token }}
      - name: the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/forkstify/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2
      - name: forkstify vectors
        run: app/target/release/forkstify vectors .
      - name: commit the index
        run: |
          if [ -z "$(git status --porcelain vectors)" ]; then
            echo "index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vectors
          git commit -q -m "Index regenerated after the merge" -m "Forkstify: index (action)"
          git push
